<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Stefy Beauty</title>
    <!-- PWA Primary Tags -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#D4AF37" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- iOS Support -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stefy POS" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Recovery script for PWA caching issues -->
    <script>
      (function() {
        window.onerror = function(msg, url, line, col, error) {
          if (msg.includes('Loading chunk') || msg.includes('Script error')) {
            console.log('Detected loading error, clearing service workers and reloading...');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for(var i = 0; i < regs.length; i++) regs[i].unregister();
                window.location.reload(true);
              });
            }
          }
          return false;
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
